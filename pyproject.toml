[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-loop"
version = "0.1.0"
description = "Autonomous AI developer harness"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
dev-loop = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = [
    "schemas/*.json",
    "playbooks/*.md",
    "capabilities/registry.yaml",
    "bundle_templates/*.json",
    "ui/static/*",
]
